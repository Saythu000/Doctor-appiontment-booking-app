name: phia_flutter
description: "DrGodly - Hardware-based sensor tracker and telehealth app."
version: 0.0.2+8

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  path: ^1.9.0
  provider: ^6.1.2
  google_fonts: ^6.2.1
  dio: ^5.7.0
  intl: ^0.20.2
  permission_handler: ^12.0.2
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1
  image_picker: ^1.1.2
  health: ^13.3.2
  flutter_secure_storage: ^11.2.0
  workmanager: ^0.10.10
  flutter_web_auth_2: ^4.1.0
  crypto: ^3.0.6
  record: ^7.1.2
  web_socket_channel: ^3.0.3
  audioplayers: ^6.8.1
  go_router: ^17.5.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/app_logo.jpeg
    - assets/avatars/avatar_1.png
    - assets/doctors/doctor_1.png
    - assets/doctors/doctor_2.png
    - assets/doctors/doctor_3.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_logo.jpeg"
  remove_alpha_ios: true

