# Checks every push and pull request to main: lints, all tests (including
# the layout and accessibility checks for every screen), and a release APK.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Configure Android SDK & licenses
        run: |
          flutter config --android-sdk $ANDROID_HOME
          yes | flutter doctor --android-licenses || true

      # Without android/key.properties (never committed) the APK is signed
      # with the debug key: fine for testing, not for the Play Store.
      - name: Build release APK
        run: |
          set -o pipefail
          flutter build apk --release --verbose 2>&1 | tee build.log || {
            echo "=== BUILD FAILED ==="
            grep -E "FAILURE|Error|error|exception|Exception" build.log | tail -n 15 | while IFS= read -r line; do
              echo "::error title=BuildError::$line"
            done
            tail -n 20 build.log | while IFS= read -r line; do
              echo "::error title=Log::$line"
            done
            exit 1
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
          retention-days: 14
